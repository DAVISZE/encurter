<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
getFirestore,
doc,
setDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyDWJ61F_1xKnLu8mFRAWQ9GqxtIIw8O5y8",
  authDomain: "encurter-2bb18.firebaseapp.com",
  projectId: "encurter-2bb18",
  storageBucket: "encurter-2bb18.firebasestorage.app",
  messagingSenderId: "563821386565",
  appId: "1:563821386565:web:da5218c55b9f1f45cebc2c",
  measurementId: "G-Q0RRSXXCQL"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



function gerarCodigo(){

let chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

let codigo="";

for(let i=0;i<8;i++){
codigo += chars[Math.floor(Math.random()*chars.length)];
}

return codigo;

}



window.criar = async function(){

let link=document.getElementById("link").value;


let codigo=gerarCodigo();


await setDoc(
doc(db,"links",codigo),
{
url:link
}
);


let resultado=
location.origin+
location.pathname+
"?c="+codigo;


document.getElementById("resultado").innerHTML=
resultado;

}



let params=new URLSearchParams(location.search);

let codigo=params.get("c");


if(codigo){

let dados=await getDoc(
doc(db,"links",codigo)
);


if(dados.exists()){

location.href=dados.data().url;

}

else{

document.body.innerHTML=
"<h1>Código inválido</h1>";

}

}


</script>
